name: FlutterRunbar
fileGroups:
  - README.md
  - project.yml
  - scripts
  - extensions/runbar-vscode
options:
  minimumXcodeGenVersion: 2.46.0
  xcodeVersion: "26.0"
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
packages:
  RunbarModules:
    path: .
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    MARKETING_VERSION: "0.10.0"
    CURRENT_PROJECT_VERSION: "47"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
targets:
  FlutterRunbar:
    type: application
    productName: Runbar
    platform: macOS
    sources:
      - Sources/FlutterRunbar
      - Resources/Assets.xcassets
    postBuildScripts:
      - name: Embed Runbar VS Code extension
        basedOnDependencyAnalysis: false
        script: |
          /usr/bin/python3 "$SRCROOT/scripts/package-vscode-extension.py" --output "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/VSCodeBridge"
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/VSCodeBridge/runbar-bridge.vsix
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/VSCodeBridge/metadata.json
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Runbar
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        RunbarSourceRevision: $(RUNBAR_SOURCE_REVISION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHighResolutionCapable: true
        NSAppDataUsageDescription: Runbar 需要核验您选择的 App 沙盒归属，并在您确认后将整个容器移到废纸篓。
        NSBonjourServices:
          - _dartVmService._tcp
        NSLocalNetworkUsageDescription: Runbar 使用本机服务发现查找您选择的 Flutter App 调试地址，用于日志和网络监听。
    settings:
      base:
        PRODUCT_NAME: Runbar
        EXECUTABLE_NAME: Runbar
        PRODUCT_MODULE_NAME: FlutterRunbar
        PRODUCT_BUNDLE_IDENTIFIER: dev.kingxcode.flutter-runbar
        ENABLE_APP_SANDBOX: false
        ENABLE_HARDENED_RUNTIME: true
        COMBINE_HIDPI_IMAGES: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: RunbarModules
        product: RunbarCore
  RunbarCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/RunbarCoreTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.kingxcode.flutter-runbar.tests
        GENERATE_INFOPLIST_FILE: true
    dependencies:
      - package: RunbarModules
        product: RunbarCore
schemes:
  FlutterRunbar:
    build:
      targets:
        FlutterRunbar: all
    run:
      config: Debug
      environmentVariables:
        OS_ACTIVITY_MODE: disable
        IDELogRedirectionPolicy: oslogToStdio
    test:
      config: Debug
      environmentVariables:
        OS_ACTIVITY_MODE: default
      targets:
        - RunbarCoreTests
    profile:
      config: Release
      environmentVariables:
        OS_ACTIVITY_MODE: default
    analyze:
      config: Debug
    archive:
      config: Release
