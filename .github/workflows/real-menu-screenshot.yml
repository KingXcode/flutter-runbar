name: Capture actual menu-bar popup
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: actual-menu-screenshot
  cancel-in-progress: true
jobs:
  capture:
    runs-on: macos-26
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      MACOSX_DEPLOYMENT_TARGET: '26.0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build screenshot-only app with fictional data
        env:
          BUILD_SCREENSHOT_PREVIEW: '1'
        run: bash scripts/build-app.sh --no-publish
      - name: Open actual status-item popup and capture menu bar
        run: bash scripts/capture-real-menu.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Runbar-actual-menu-popup
          path: |
            screenshots/actual-menu-*.png
            screenshots/actual-menu-*.txt
          retention-days: 3
